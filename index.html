<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Восток-Лизинг · Кабинет</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/golos.css">
<style>
/* Layout: light left rail + white working area; the logo's horizontal stripes reappear as the progress device everywhere */
:root{
  --paper:#F3F6F9; --surface:#FFFFFF; --ink:#0F2238; --navy:#163A5F; --blue:#2A6AA6; --sky:#E4EEF7; --sky2:#F0F5FA;
  --line:#D6DFE8; --muted:#5F7288; --ok:#1F7A4D; --ok-bg:#E6F4EC; --warn:#A85E0A; --warn-bg:#FBF1E2; --bad:#B4322B; --bad-bg:#FBE9E7;
  --rail:#FFFFFF; --brand-grad:linear-gradient(135deg,#143657 0%,#1F5A8C 100%);
  --shadow:0 1px 2px rgba(15,34,56,.06),0 8px 24px -12px rgba(15,34,56,.18);
  --font:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;line-height:1.2}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
a{color:var(--blue)}
a.btn{text-decoration:none}
.sub{display:block;font-size:12px;color:var(--muted)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- logo ---------- */
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase;color:var(--navy)}
.logo i{display:block;font-style:normal;font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}

/* ---------- login ---------- */
#app{min-height:100%}
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;background:var(--brand-grad);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.login-art .sphere{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:min(42%,480px);aspect-ratio:1;color:#9CC4EA;opacity:.55;pointer-events:none}
.login-art h1{font-size:34px;line-height:1.15;position:relative;font-weight:600;text-wrap:initial}
.login-art p{position:relative;max-width:40ch;opacity:.8;margin-top:14px}
.login-form{display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--surface)}
.login-form form{width:100%;max-width:380px;display:grid;gap:16px}
.seg{display:flex;background:var(--sky2);border-radius:10px;padding:4px}
.seg>*{flex:1 1 auto;border:0;background:transparent;padding:9px 14px;min-height:0;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;text-align:center;text-decoration:none;line-height:1.4}
.seg>*:hover{color:var(--ink)}
.seg>[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--blue);background:var(--sky2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy);border-color:var(--navy)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sky2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.demo-note{font-size:13px;color:var(--muted);text-align:center}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--blue)}
.found{display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-size:14px}
.found b{color:var(--ink)}
.found .sub{color:var(--ink);opacity:.7}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code input{text-align:center;font-size:22px;font-weight:600;padding:10px 0;font-variant-numeric:tabular-nums}
.done{display:grid;gap:12px;text-align:center;justify-items:center}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.done .ok svg{width:28px;height:28px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
.nav a svg{width:18px;height:18px;color:var(--muted)}
.nav a:hover{background:var(--sky2)}
.nav a[aria-current="page"]{background:var(--sky);color:var(--navy)}
.nav a[aria-current="page"] svg{color:var(--navy)}
.rail .demo{font-size:11px;color:var(--muted);padding:0 12px}
.nav .cnt{margin-left:auto;background:var(--blue);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px}
.rail .mgr{margin-top:auto;font-size:13px;display:grid;gap:8px;padding:16px 12px 4px;border-top:1px solid var(--line);line-height:1.4}
.rail .mgr .t{color:var(--muted)}
.rail .mgr b{font-weight:600;font-size:14px}
.rail .mgr a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;min-width:0}
.rail .mgr a:hover{color:var(--blue)}
.rail .mgr a svg{width:15px;height:15px;color:var(--muted);flex:none}
.rail .mgr .hrs{color:var(--muted);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:24px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .co{display:inline-flex;align-items:center;gap:8px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;max-width:min(60vw,360px)}
.topbar .co span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .co svg{width:14px;height:14px;color:var(--muted);flex:none}
.topbar .sync{font-size:13px;color:var(--muted);margin-left:auto}
.topbar .who{display:flex;align-items:center;gap:20px;font-size:14px;white-space:nowrap}
.topbar .who .role{color:var(--muted)}
.topbar .who .role::before{content:"·";margin:0 6px}
.burger{display:none}
.content{padding:28px 36px 56px;display:grid;gap:28px;max-width:1560px;width:100%;margin-inline:auto}
.content>*,.grid2>*,.grid3>*,.statement>*,.cal>*,.card>*{min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .hd h2{font-size:15px}
.card .hd .more{margin-left:auto;font-size:13px}
.card .bd{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* statement block on home */
.statement{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:stretch}
.stmt{position:relative;overflow:hidden;background:var(--brand-grad);color:#fff;border-radius:14px;padding:30px 32px;display:grid;gap:16px;align-content:center}
.stmt .lines{position:absolute;right:-6%;bottom:-28%;height:118%;aspect-ratio:1;color:#9CC4EA;opacity:.28;pointer-events:none}
.stmt .lbl{font-size:14px;color:#C9DCEE}
.stmt .big{font-size:46px;line-height:1;font-weight:600;letter-spacing:-.02em}
.stmt .lead{font-size:15px;line-height:1.5;color:#E6EFF8;max-width:36ch}
.stmt .lead b{color:#fff}
.stmt .lbl,.stmt .big,.stmt .lead{position:relative}
.stmt .cta{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.stmt .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff}
.stmt .btn:hover{background:rgba(255,255,255,.16)}
.stmt .btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.stmt .btn.primary:hover{background:var(--sky)}
.attn{display:grid;gap:0}
.attn a{display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;padding:14px 18px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.attn a:first-of-type{border-top:0}
.attn a:hover{background:var(--sky2)}
.attn .dot{width:8px;height:8px;border-radius:50%}
.attn .t{font-weight:500;display:block}
.attn .d{font-size:13px;color:var(--muted);display:block}
.attn .go{color:var(--muted)}

/* 90-day timeline */
.tl{position:relative;padding:26px 0 8px}
.tl .axis{height:2px;background:var(--line);position:relative;margin:34px 0 0}
.tl .mk{position:absolute;top:-7px;transform:translateX(-50%);display:grid;justify-items:center;gap:6px}
.tl .mk i{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tl .mk.due i{background:var(--warn)}
.tl .mk.late i{background:var(--bad)}
.tl .mk .v{font-size:13px;font-weight:600;white-space:nowrap}
.tl .mk .c{font-size:11px;color:var(--muted);white-space:nowrap}
.tl .mk.up{top:auto;bottom:-7px}
.tl .mk.up .v{order:-2}.tl .mk.up .c{order:-1}
.tl .months{position:relative;height:18px;font-size:12px;color:var(--muted)}
.tl .months span{position:absolute;top:0;padding-left:6px;border-left:1px solid var(--line);line-height:1.2}
.tl .months span:first-child{border-left:0;padding-left:0}
.tl .past{position:absolute;left:0;top:-1px;height:4px;background:var(--navy);border-radius:2px}
.tl .now{position:absolute;top:-6px;width:3px;height:14px;background:var(--navy);border-radius:2px;transform:translateX(-50%);z-index:2}
.tl .now::after{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--navy);border-bottom:0}

.tl-key{display:inline-block;width:18px;height:4px;background:var(--navy);border-radius:2px;margin-right:6px;vertical-align:middle}
.tl-list{display:none;list-style:none;margin:0;padding:0}
.tl-list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tl-list li:first-child{border-top:0}
.tl-list .d{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sky);color:var(--navy);font-variant-numeric:tabular-nums}
.tl-list .d.late{background:var(--bad-bg);color:var(--bad)}
.tl-list .d.due{background:var(--warn-bg);color:var(--warn)}
/* stripes = the logo device as progress */
.stripes{display:flex;gap:3px;height:14px;align-items:flex-end}
.stripes i{flex:none;width:4px;background:var(--line);border-radius:1px;height:100%}
.stripes.wide i{flex:1;width:auto}
.stripes i.on{background:var(--blue)}
.stripes.ok i.on{background:var(--ok)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--sky2)}
.tbl .r{text-align:right}
.tbl .sub{display:block;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--sky);color:var(--navy);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;position:relative;top:1px;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.off{background:var(--sky2);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px 24px}
/* contract cards for phones; the table stays for desktop */
.clist{display:none;list-style:none;margin:0;padding:0}
.clist li{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.clist li:first-child{border-top:0}
.clist a{text-decoration:none;color:inherit;display:grid;gap:8px}
.clist .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.clist .row2{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.clist .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.clist .kv span{display:grid;gap:1px}
.clist .kv i{font-style:normal;color:var(--muted);font-size:12px}
.clist .sel{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.clist .sel input{width:auto;margin-top:4px}
@media (max-width:760px){.clist{display:block}.clist + .scroll,.scroll:has(+ .clist){display:none}}
.dl div{display:grid;gap:2px}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar select,.toolbar input{width:auto}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--sky2);border-bottom:1px solid var(--line);font-size:14px}
.bulk .btn{margin-left:0}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:1fr 300px;gap:20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .wd{font-size:12px;color:var(--muted);padding:4px 6px}
.cal-grid .day{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;display:grid;align-content:start;gap:4px}
.cal-grid .day.off{opacity:.35}
.cal-grid .day.we{background:var(--sky2)}
.cal-grid .day.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal-grid .day .pay{background:var(--sky);color:var(--navy);border-radius:5px;padding:3px 5px;font-weight:600;font-size:11px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-grid .day .pay.late{background:var(--bad-bg);color:var(--bad)}
.cal-grid .day .pay.paid{background:var(--ok-bg);color:var(--ok)}
.cal-side{display:grid;gap:14px;align-content:start}
.cal-side .sum{font-size:28px;font-weight:600;letter-spacing:-.02em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet / dialog */
.sheet{position:fixed;inset:0;background:rgba(10,20,34,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet .box{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:var(--shadow);display:grid;gap:18px;padding:22px 24px;max-height:90vh;overflow:auto}
.sheet .box h2{font-size:17px}
.qr{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.qr canvas{width:150px;height:150px;border:1px solid var(--line);border-radius:8px;image-rendering:pixelated}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--blue);background:var(--sky2)}
.radios input{width:auto;margin-top:3px}
.radios small{display:block;color:var(--muted);font-size:12px}
.hsteps{list-style:none;margin:0;padding:0;display:flex;align-items:flex-start;min-width:0}
.hsteps li{position:relative;flex:1;font-size:12px;color:var(--muted);padding:16px 6px 0 0;min-width:0;line-height:1.3}
.hsteps li::before{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--line);box-sizing:border-box}
.hsteps li::after{content:"";position:absolute;top:4px;left:12px;right:2px;height:2px;background:var(--line)}
.hsteps li:last-child::after{display:none}
.hsteps li.done{color:var(--ink)}
.hsteps li.done::before,.hsteps li.done::after{background:var(--ok)}
.hsteps li.cur{color:var(--ink);font-weight:500}
.hsteps li.cur::before{background:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.hsteps li.next::before{background:var(--surface);border:2px solid var(--line)}
.steps{display:grid;gap:0}
.steps div{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:6px 0;font-size:13px;position:relative}
.steps div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:5px}
.steps div.done::before{background:var(--ok)}
.steps div.cur::before{background:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.steps div:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:19px;bottom:-6px;width:1px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:60}
.demo-tag{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;z-index:40}
body:has(.app) .demo-tag{display:none}
.tbl .nowrap{white-space:nowrap}
.tbl.fixed{table-layout:fixed;min-width:760px}
.tbl.fixed td{overflow-wrap:anywhere}

@media (max-width:980px){
  .statement,.grid2,.grid3,.cal{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login-art{min-height:260px;padding:28px}
  .login-art .sphere{right:-30%;width:70%}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:272px;transform:translateX(-100%);transition:transform .2s;z-index:30;height:100dvh}
  .rail.open{transform:none;box-shadow:0 0 0 100vw rgba(10,20,34,.4)}
  .burger{display:inline-flex}
  .topbar{padding:10px 16px;gap:12px}
  .topbar .sync,.topbar .who .role,.topbar .who b{display:none}
  .tl{display:none}
  .tl-list{display:block}
  .topbar .who{margin-left:auto;gap:12px}
  .content{padding:20px 16px 40px;gap:20px}
  .page-head .actions{margin-left:0;width:100%}
  h1{font-size:22px}
  .stmt{padding:22px 20px}
  .stmt .big{font-size:36px}

  const code=document.getElementById('code');
  if(code) code.querySelectorAll('input').forEach((el,i,all)=>el.addEventListener('input',()=>{ if(el.value&&all[i+1]) all[i+1].focus(); }));
  f.onsubmit=e=>{ e.preventDefault();
    if(REG.step===1){ const v=inn.value.trim(); if(!/^\d{10}$|^\d{12}$/.test(v)) return toast('ИНН: 10 цифр для юрлица или 12 для ИП'); REG.inn=v; }
    if(REG.step===3){ const v=[...code.querySelectorAll('input')].map(i=>i.value).join(''); if(v.length<6) return toast('Введите все 6 цифр кода'); }

}

const NAV=[['#/home','Главная',I.home],['#/contracts','Договоры',I.doc],['#/accounting','Бухгалтерия',I.calc],['#/requests','Запросы',I.req],['#/insurance','Полисы',I.shield],['#/settings','Настройки',I.cog]];
const TITLES={home:'Главная',contracts:'Договоры',contract:'Договор',accounting:'Бухгалтерия',requests:'Запросы',requestNew:'Новый запрос',insurance:'Полисы',settings:'Настройки'};
function shell(view, inner, base){
  const open = REQUESTS.filter(r=>r.st!=='done').length;
  return `<div class="app"><aside class="rail" id="rail">
    <a class="logo" href="#/home">${sphere()}<span><b>Восток-Лизинг</b><i>Кабинет клиента</i></span></a>
    <nav class="nav">${NAV.map(n=>`<a href="${n[0]}" ${n[0]==='#/'+base?'aria-current="page"':''}>${n[2]}${n[1]}${n[0]==='#/requests'&&open?`<span class="cnt">${open}</span>`:''}</a>`).join('')}</nav>
    <div class="mgr"><span class="t">Ваш персональный менеджер</span><b>Алина Гатауллина</b>
      <a class="num" href="tel:+78430000000">${I.phone}+7 843 000-00-00</a>
      <a href="mailto:a.gataullina@vostok-leasing.ru">${I.mail}a.gataullina@vostok-leasing.ru</a>
      <span class="hrs">Пн–пт, 9:00–18:00 по Казани</span></div>
    <div class="demo">Демо-концепт. Данные вымышленные</div>
  </aside>
  <div class="main"><header class="topbar"><button class="btn ghost burger" aria-label="Меню" onclick="event.stopPropagation();document.getElementById('rail').classList.toggle('open')">${I.menu}</button>
    <button class="co" onclick="toast('В демо одна компания. В настройках можно добавить другие юрлица')"><span>${esc(COMPANY.name)}</span>${I.chev.replace('<svg','<svg style="transform:rotate(90deg)"')}</button>

    <div class="who"><span><b>${COMPANY.user}</b><span class="role">${COMPANY.role}</span></span><a class="btn sm" href="#/">Выйти</a></div></header>
    <main class="content">${inner}</main></div></div>`;
}
function render(view, ...args){
  const app=document.getElementById('app');
  if(view==='login'){ app.innerHTML=V.login(); document.title='Вход · Восток-Лизинг'; document.getElementById('lf').onsubmit=e=>{e.preventDefault(); location.hash='#/home';}; return; }
  if(view==='register'){ app.innerHTML=V.register(); document.title='Регистрация · Восток-Лизинг'; regInit(); window.scrollTo(0,0); return; }
  const base = view==='contract'?'contracts':view==='requestNew'?'requests':view;
  app.innerHTML=shell(view, V[view](...args), base);
  const rail=document.getElementById('rail'); rail.classList.remove('open');
  document.querySelector('.main').addEventListener('click',()=>rail.classList.remove('open'));
  document.title=`${TITLES[view]} · Восток-Лизинг`;
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash.replace(/^#\/?/,''); const [a,...rest]=h.split('/'); const r=rest.join('/');
  if(!a) return render('login');
  if(a==='register'){ REG.step=1; return render('register'); }
  if(a==='contracts' && r) return render('contract', decodeURIComponent(r));
  if(a==='accounting') return render('accounting', r||'calendar');
  if(a==='settings') return render('settings', r||'staff');
  if(a==='requests' && r==='new') return render('requestNew');
  if(a==='requests') return render('requests', r||'all');
  if(V[a]) return render(a);
  render('login');
}
window.addEventListener('hashchange', route); route();
